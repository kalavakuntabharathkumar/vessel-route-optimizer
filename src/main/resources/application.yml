spring:
  application:
    name: vessel-route-optimizer
  datasource:
    url: jdbc:postgresql://localhost:5432/vessel_optimizer
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

osrm:
  base-url: https://router.project-osrm.org

server:
  port: 8080
  tomcat:
    threads:
      max: 200
    accept-count: 100

logging:
  level:
    com.vessel.optimizer: DEBUG
    org.springframework.web: INFO
spring:
  application:
    name: vessel-route-optimizer
  datasource:
    url: jdbc:postgresql://localhost:5432/vessel_optimizer
    username: YOUR_DB_USER
    password: YOUR_DB_PASSWORD
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

osrm:
  base-url: https://router.project-osrm.org

server:
  port: 8080